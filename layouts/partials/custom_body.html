<button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark / light mode">
  <svg class="sun-cloud" viewBox="0 0 40 40" aria-hidden="true">
    <g class="rays">
      <line x1="20" y1="2"  x2="20" y2="8"/>
      <line x1="20" y1="32" x2="20" y2="38"/>
      <line x1="2"  y1="20" x2="8"  y2="20"/>
      <line x1="32" y1="20" x2="38" y2="20"/>
      <line x1="7"  y1="7"  x2="11" y2="11"/>
      <line x1="29" y1="29" x2="33" y2="33"/>
      <line x1="7"  y1="33" x2="11" y2="29"/>
      <line x1="29" y1="11" x2="33" y2="7"/>
    </g>
    <circle class="sun-core" cx="20" cy="20" r="8"/>
    <path class="cloud" d="M12 27 a6 6 0 0 1 0.4 -11.9 a8 8 0 0 1 15.2 2.1 a5.5 5.5 0 0 1 -0.6 10.8 Z"/>
  </svg>
</button>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
