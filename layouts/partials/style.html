<style>
  :root {
      --width: 800px;
      /* Headings: Work Sans — clean + friendly, kerns "ry" properly (unlike Helvetica/Arial).
         To swap it, change the family here and the <link> in partials/custom_head.html. */
      --font-main: "Work Sans", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-secondary: Helvetica, Arial, system-ui, sans-serif;
      --font-scale: 1em;

      /* Light — soft sage-green paper + forest greens */
      --background-color: #e9f0df;
      --heading-color: #21402c;
      --text-color: #423f39;
      --link-color: #2f7a54;
      --visited-color: #5f7d5a;
      --code-background-color: #dee8d3;
      --code-color: #33302b;
      --blockquote-color: #55524c;

      /* Progressively greener italics */
      --green-1: #6d7d61;
      --green-2: #4f8354;
      --green-3: #338648;
      --green-4: #167a38;
  }

  /* Dark theme — applied when the user has no explicit choice but prefers dark */
  @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
          --background-color: #161814;
          --heading-color: #cbd6c3;
          --text-color: #d6d3ca;
          --link-color: #8fbf9f;
          --visited-color: #7ba888;
          --code-background-color: #2a2e27;
          --code-color: #e2e0d7;
          --blockquote-color: #b8b5ac;

          --green-1: #a3bdb0;
          --green-2: #86bcac;
          --green-3: #6cbaa7;
          --green-4: #52b6a0;
      }
  }

  /* Dark theme — applied when the user explicitly chooses dark */
  :root[data-theme="dark"] {
      --background-color: #161814;
      --heading-color: #cbd6c3;
      --text-color: #d6d3ca;
      --link-color: #8fbf9f;
      --visited-color: #7ba888;
      --code-background-color: #2a2e27;
      --code-color: #e2e0d7;
      --blockquote-color: #b8b5ac;

      --green-1: #a3bdb0;
      --green-2: #86bcac;
      --green-3: #6cbaa7;
      --green-4: #52b6a0;
  }

  body {
      font-family: var(--font-secondary);
      font-size: var(--font-scale);
      margin: auto;
      /* Extra top padding so the header clears the top of the screen (and the
         fixed theme toggle) instead of hugging it. */
      padding: 60px 20px 24px;
      padding-top: calc(60px + env(safe-area-inset-top, 0px));
      max-width: var(--width);
      text-align: left;
      background-color: var(--background-color);
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.5;
      color: var(--text-color);
      transition: background-color 0.12s ease, color 0.12s ease;
  }

  @media (max-width: 600px) {
      body {
          padding: 48px 16px 24px;
          padding-top: calc(48px + env(safe-area-inset-top, 0px));
      }
  }

  h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-main);
      color: var(--heading-color);
      font-kerning: normal;
      font-variant-ligatures: common-ligatures;
  }

  a {
      color: var(--link-color);
      cursor: pointer;
      text-decoration: none;
  }

  a:hover {
      text-decoration: underline;
  }

  nav a {
      margin-right: 8px;
  }

  strong, b {
      color: var(--heading-color);
  }

  button {
      margin: 0;
      cursor: pointer;
  }

  main {
      line-height: 1.6;
  }

  table {
      width: 100%;
  }

  hr {
      border: 0;
      border-top: 1px dashed;
  }

  img {
      max-width: 100%;
  }

  code {
      font-family: monospace;
      padding: 2px;
      background-color: var(--code-background-color);
      color: var(--code-color);
      border-radius: 3px;
  }

  blockquote {
      border-left: 1px solid #999;
      color: var(--blockquote-color);
      padding-left: 20px;
      font-style: italic;
  }

  footer {
      padding: 15px 0;
      text-align: center;
  }

  .title:hover {
      text-decoration: none;
  }

  .title h1 {
      font-size: 1.4em;
  }

  .inline {
      width: auto !important;
  }

  .highlight, .code {
      padding: 1px 15px;
      background-color: var(--code-background-color);
      color: var(--code-color);
      border-radius: 3px;
      margin-block-start: 1em;
      margin-block-end: 1em;
      overflow-x: auto;
  }

  /* blog post list */
  ul.blog-posts {
      list-style-type: none;
      padding: unset;
  }

  ul.blog-posts li {
      display: flex;
  }

  ul.blog-posts li span {
      flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
      color: var(--visited-color);
  }

  /* Title + spinning star */
  .title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
  }

  .title-text h2 {
      margin: 0;
      /* A hair of tracking keeps pairs like "ry" in "Crystal" from colliding. */
      letter-spacing: 0.01em;
  }

  .sparkle-link {
      display: inline-flex;
      line-height: 0;
  }

  .sparkle-logo {
      display: inline-block;
      width: 30px;
      height: 30px;
      transition: transform 0.4s ease;
      fill: var(--heading-color);
  }

  .sparkle-link:hover .sparkle-logo {
      transform: rotate(360deg);
      animation: twinkle 2s infinite;
  }

  @keyframes twinkle {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
  }

  /* Progressively greener italics on the home page */
  em.g1 { color: var(--green-1); font-style: italic; }
  em.g2 { color: var(--green-2); font-style: italic; }
  em.g3 { color: var(--green-3); font-style: italic; }
  em.g4 { color: var(--green-4); font-style: italic; }

  /* Collapsible list dropdowns */
  .dropdown {
      margin: 0.6em 0;
  }

  .dropdown summary {
      cursor: pointer;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      user-select: none;
  }

  .dropdown summary::-webkit-details-marker {
      display: none;
  }

  /* No transition/animation anywhere here — dropdowns open instantly. */
  .dropdown summary::before {
      content: "\25B8"; /* ▸ */
      color: var(--link-color);
      font-size: 0.85em;
  }

  .dropdown[open] summary::before {
      transform: rotate(90deg);
  }

  /* Dark / light toggle button (top right) */
  #theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      width: 42px;
      height: 42px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
  }

  #theme-toggle:hover {
      background: color-mix(in srgb, var(--heading-color) 12%, transparent);
  }

  #theme-toggle svg {
      width: 30px;
      height: 30px;
      overflow: visible;
  }

  /* Sun */
  #theme-toggle .sun-core {
      fill: #e8a13a;
      transition: fill 0.18s ease;
  }

  #theme-toggle .rays line {
      stroke: #e8a13a;
      stroke-width: 2;
      stroke-linecap: round;
      transform-origin: 20px 20px;
      transition: opacity 0.16s ease, transform 0.2s ease;
  }

  /* Cloud starts retracted (tucked up-right, invisible) */
  #theme-toggle .cloud {
      fill: var(--heading-color);
      opacity: 0;
      transform: translate(12px, -14px) scale(0.2);
      transform-origin: 20px 20px;
      transition: transform 0.26s cubic-bezier(0.34, 1.3, 0.5, 1), opacity 0.18s ease;
  }

  /* Dark mode: cloud rolls in over the sun, rays fade */
  :root[data-theme="dark"] #theme-toggle .cloud {
      opacity: 1;
      transform: translate(0, 3px) scale(1.05);
  }

  :root[data-theme="dark"] #theme-toggle .rays line {
      opacity: 0;
      transform: scale(0.5);
  }

  :root[data-theme="dark"] #theme-toggle .sun-core {
      fill: #cdb98a;
  }

  /* ============================== Footnotes =============================
     Two parts: the collected list Hugo renders at the bottom of the post
     (goldmark's default footnote HTML — .footnotes / .footnote-ref / etc.,
     just restyled to match the theme), and a hover/focus-triggered sidenote
     box that partials/footnotes.html always places beside the reference —
     in the true margin when there's room, narrower and hugging the
     viewport edge when there isn't. On touch devices (no hover) it opens
     on tap instead — see the script for the split. Clicking the number
     itself always jumps to its entry in the list below, same as a plain
     footnote link. */

  .footnotes {
      margin-top: 3em;
      font-size: 0.85em;
      color: var(--text-color);
  }

  .footnotes hr {
      border-top: 1px dashed;
      opacity: 0.5;
      margin-bottom: 1.2em;
  }

  .footnotes ol { padding-left: 1.3em; }
  .footnotes li { margin-bottom: 0.7em; }
  .footnotes li p { margin: 0; display: inline; }

  .footnote-backref {
      margin-left: 3px;
      text-decoration: none;
  }

  .footnote-ref {
      text-decoration: none;
      padding: 0 1px;
  }

  /* Shown while its sidenote box is open. */
  .footnote-ref[aria-expanded="true"] {
      background: color-mix(in srgb, var(--link-color) 28%, transparent);
  }

  /* The popup box itself. No transition/animation anywhere in this block —
     it snaps open and closed. Colour is derived from the theme so it's
     automatically "a bit lighter/darker than the background" in both
     light and dark mode without separate overrides. */
  .footnote-popup {
      position: absolute;
      z-index: 150;
      box-sizing: border-box;
      padding: 12px 14px;
      font-size: 0.85em;
      line-height: 1.5;
      background: color-mix(in srgb, var(--heading-color) 6%, var(--background-color));
      border: 1px solid color-mix(in srgb, var(--heading-color) 45%, transparent);
      border-radius: 0;
      pointer-events: auto;
  }

  .footnote-popup p { margin: 0; }
  .footnote-popup a { color: var(--link-color); }

  /* Dotted leader line from the footnote number to the box — always a
     straight run of one or two axis-aligned segments, never a diagonal.
     A segment left at zero length (the common case) simply doesn't show,
     leaving a single straight line; the second segment only appears when
     the box had to shift to stay clamped on-screen. */
  .footnote-connector-h,
  .footnote-connector-v {
      position: absolute;
      z-index: 149;
      pointer-events: none;
  }

  .footnote-connector-h {
      height: 0;
      border-top: 1px dotted color-mix(in srgb, var(--heading-color) 55%, transparent);
  }

  .footnote-connector-v {
      width: 0;
      border-left: 1px dotted color-mix(in srgb, var(--heading-color) 55%, transparent);
  }
</style>
